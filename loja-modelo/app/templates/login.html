
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#faf7f2">
    <title>Entrar | Minha Loja</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>

    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a href="{{ url_for('loja.menu') }}" class="logo">Minha Loja</a>

            <nav class="navegacao">
                <a href="{{ url_for('loja.menu') }}">Início</a>
                <a href="{{ url_for('autenticacao.cadastro') }}">Criar conta</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="formulario">
            <div class="texto-centro">
                <h1>Bem-vindo de volta</h1>
                <p>Entre na sua conta para continuar suas compras.</p>
            </div>

            <form method="POST" action="{{ url_for('autenticacao.login') }}">
                <div>
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        inputmode="numeric"
                        autocomplete="username"
                        required
                    >
                </div>

                <button type="submit" class="botao-dourado">
                    Entrar na minha conta
                </button>
            </form>

            <p class="texto-centro">
                Ainda não tem uma conta?
                <a href="{{ url_for('autenticacao.cadastro') }}">
                    Cadastre-se
                </a>
            </p>

            <div class="texto-centro">
                <a href="{{ url_for('loja.menu') }}">Voltar à loja</a>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="container">
            <a href="{{ url_for('loja.menu') }}" class="logo">Minha Loja</a>
            <p>Qualidade, praticidade e confiança.</p>
            <p>&copy; 2026 Minha Loja. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
