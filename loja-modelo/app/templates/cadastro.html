<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | LojaBase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <section class="secao">
            <h1>Criar conta</h1>
            <p>Preencha seus dados para se cadastrar.</p>

            <form method="POST" action="{{ url_for('autenticacao.cadastro') }}" class="formulario">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf"
                       placeholder="000.000.000-00"
                       maxlength="14" required>

                <button type="submit" class="botao">Criar conta</button>
            </form>

            <p>Já possui uma conta?
                <a href="{{ url_for('autenticacao.login') }}">Entrar</a>
            </p>

            <a href="{{ url_for('loja.menu') }}">Voltar à loja</a>
        </section>
    </main>
</body>
</html>
