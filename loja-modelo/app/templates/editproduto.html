<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3e2723">

    <title>Editar Produto | LojaBase</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>

    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a href="{{ url_for('loja.menu') }}" class="logo">
                LojaBase<span>.</span>
            </a>

            <button type="button" data-menu-toggle aria-label="Abrir menu">
                ☰
            </button>

            <nav class="navegacao" data-menu>
                <a href="{{ url_for('loja.menu') }}">Ver loja</a>
                <a href="{{ url_for('dashboard.dashboard_menu') }}">Painel</a>
                <a href="{{ url_for('dashboard.ver_pedidos') }}">Pedidos</a>
                <a href="{{ url_for('autenticacao.logout') }}">Sair</a>
            </nav>
        </div>
    </header>

    <main class="container secao">

        <div style="margin-bottom: 30px;">
            <p>ADMINISTRAÇÃO</p>
            <h1>Editar produto</h1>
            <p>Atualize as informações de <strong>{{ produto.nome }}</strong>.</p>
        </div>

        <section class="painel" style="max-width: 750px; margin: 0 auto;">

            <form
                action="{{ url_for('dashboard.editproduto', id=produto.id) }}"
                method="POST"
                enctype="multipart/form-data"
                class="formulario"
                data-envio-unico
            >

                <div>
                    <label for="nome">Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="{{ produto.nome }}"
                        maxlength="120"
                        required
                    >
                </div>

                <div>
                    <label for="categoria">Categoria</label>
                    <input
                        type="text"
                        id="categoria"
                        name="categoria"
                        value="{{ produto.categoria }}"
                        maxlength="80"
                        required
                    >
                </div>

                <div>
                    <label for="preco">Preço (R$)</label>
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        value="{{ produto.preco }}"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div>
                    <label for="estoque">Quantidade em estoque</label>
                    <input
                        type="number"
                        id="estoque"
                        name="estoque"
                        value="{{ produto.estoque }}"
                        min="0"
                        step="1"
                        required
                    >
                </div>

                <div>
                    <label for="descricao">Descrição do produto</label>
                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="5"
                        maxlength="2000"
                    >{{ produto.descricao|default('', true) }}</textarea>
                </div>

                <div>
                    <label>Imagem atual</label>

                    {% if produto.imagem %}
                        <img
                            src="{{ url_for('static', filename='img/' ~ produto.imagem) }}"
                            alt="{{ produto.nome }}"
                            style="display: block; width: 180px; height: 180px; object-fit: cover; border-radius: 12px; margin: 10px 0 15px;"
                        >
                    {% else %}
                        <p>Nenhuma imagem cadastrada.</p>
                    {% endif %}
                </div>

                <div>
                    <label for="imagem">Substituir imagem (opcional)</label>
                    <input
                        type="file"
                        id="imagem"
                        name="imagem"
                        accept="image/png,image/jpeg,image/webp"
                    >

                    <img
                        id="preview-imagem"
                        alt="Pré-visualização da nova imagem"
                        style="display: none; width: 180px; height: 180px; object-fit: cover; border-radius: 12px; margin-top: 15px;"
                    >
                </div>

                <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px;">
                    <button type="submit" class="botao">
                        Salvar alterações
                    </button>

                    <a href="{{ url_for('dashboard.dashboard_menu') }}" class="botao secundario">
                        Cancelar
                    </a>
                </div>

            </form>

        </section>

    </main>

    <footer class="rodape">
        <div class="container">
            <p>LojaBase · 2026</p>
        </div>
    </footer>

    <script>
        const campoImagem = document.getElementById("imagem");
        const preview = document.getElementById("preview-imagem");

        campoImagem.addEventListener("change", function () {
            const arquivo = this.files[0];

            if (arquivo && arquivo.type.startsWith("image/")) {
                preview.src = URL.createObjectURL(arquivo);
                preview.style.display = "block";
            } else {
                preview.removeAttribute("src");
                preview.style.display = "none";
            }
        });
    </script>

</body>
</html>
